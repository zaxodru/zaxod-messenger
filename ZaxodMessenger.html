<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZaxodMessenger — Облачный мессенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090714;--bg2:#100d22;--bg3:#160f30;--bg4:#1c1440;--bg5:#221950;
  --acc:#7c3aed;--acc2:#9b5cf6;--acc3:#c4b5fd;
  --accS:rgba(124,58,237,.13);--accB:rgba(124,58,237,.3);
  --online:#34d399;--t1:#f0ecff;--t2:#a594d0;--t3:#5a4880;
  --r:14px;--rs:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--t1);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 55% 45% at 8% 15%,rgba(109,40,217,.14) 0%,transparent 65%),
             radial-gradient(ellipse 35% 35% at 92% 85%,rgba(76,29,149,.10) 0%,transparent 60%);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,.3);border-radius:2px;}

/* ── AUTH ── */
#authScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);}
#authScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 40%,rgba(124,58,237,.18) 0%,transparent 70%);pointer-events:none;}
.auth-card{background:var(--bg3);border:1px solid var(--accB);border-radius:20px;padding:34px 38px;width:355px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 80px rgba(124,58,237,.1);animation:cardIn .4s ease-out;}
@keyframes cardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.auth-logo{text-align:center;margin-bottom:26px;}
.auth-logo-icon{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#5b21b6,#7c3aed);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:19px;margin:0 auto 11px;box-shadow:0 6px 22px rgba(124,58,237,.5);}
.auth-logo h1{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:900;background:linear-gradient(90deg,#a78bfa,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.auth-logo p{font-size:12px;color:var(--t3);margin-top:4px;}
.auth-tabs{display:flex;background:var(--bg4);border-radius:10px;padding:3px;margin-bottom:20px;}
.auth-tab{flex:1;text-align:center;padding:8px;font-size:13px;font-weight:700;cursor:pointer;border-radius:8px;color:var(--t3);transition:all .2s;}
.auth-tab.active{background:var(--accS);color:var(--acc2);border:1px solid var(--accB);}
.auth-field{margin-bottom:13px;}
.auth-field label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.06em;display:block;margin-bottom:5px;}
.auth-field input{width:100%;background:var(--bg4);border:1px solid rgba(124,58,237,.2);border-radius:var(--rs);padding:10px 13px;font-family:'Nunito',sans-serif;font-size:14px;color:var(--t1);outline:none;transition:border-color .2s;}
.auth-field input::placeholder{color:var(--t3);}
.auth-field input:focus{border-color:var(--acc);}
.av-picker-row{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;justify-content:center;}
.av-pick{width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid transparent;transition:all .2s;}
.av-pick.sel{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(124,58,237,.3);}
.auth-btn{width:100%;padding:12px;border:none;border-radius:var(--rs);background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(124,58,237,.4);}
.auth-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(124,58,237,.55);}
.auth-err{font-size:12px;color:#f87171;text-align:center;margin-top:8px;min-height:16px;}

/* ── APP (основной интерфейс) ── */
#app{flex:1;display:flex;overflow:hidden;position:relative;z-index:1;}

/* SIDEBAR */
.sbi{width:62px;background:var(--bg2);border-right:1px solid rgba(124,58,237,.1);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:20;flex-shrink:0;}
.sbi-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#5b21b6,#7c3aed);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:13px;box-shadow:0 4px 16px rgba(124,58,237,.5);margin-bottom:8px;}
.nb{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);position:relative;border:none;background:none;transition:all .18s;}
.nb:hover{background:var(--accS);color:var(--acc3);}
.nb.active{background:var(--accS);color:var(--acc2);}
.nb.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--acc2);border-radius:0 3px 3px 0;}
.nb svg{width:19px;height:19px;}
.sp{flex:1;}
.me-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid var(--accB);cursor:pointer;transition:transform .2s;}
.me-av:hover{transform:scale(1.08);}

/* LEFT PANEL */
.lp{width:268px;background:var(--bg3);border-right:1px solid rgba(124,58,237,.1);display:flex;flex-direction:column;z-index:10;flex-shrink:0;}
.lp-head{padding:15px 12px 9px;border-bottom:1px solid rgba(124,58,237,.08);}
.lp-title{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;margin-bottom:8px;}
.srch{display:flex;align-items:center;gap:7px;background:var(--bg4);border:1px solid rgba(124,58,237,.18);border-radius:var(--rs);padding:7px 10px;transition:border-color .2s;}
.srch:focus-within{border-color:var(--acc);}
.srch svg{color:var(--t3);flex-shrink:0;width:13px;height:13px;}
.srch input{background:none;border:none;outline:none;color:var(--t1);font-family:'Nunito',sans-serif;font-size:12.5px;width:100%;}
.srch input::placeholder{color:var(--t3);}
.lp-tabs{display:flex;padding:7px 10px 0;gap:3px;}
.lp-tab{flex:1;text-align:center;padding:5px 2px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--t3);cursor:pointer;border-radius:7px;transition:all .18s;}
.lp-tab.active{background:var(--accS);color:var(--acc2);}
.lp-tab:hover:not(.active){color:var(--t2);}
.lp-list{flex:1;overflow-y:auto;padding:5px 0;}
.lp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px 16px;text-align:center;}
.lp-empty svg{width:36px;height:36px;color:var(--t3);opacity:.45;}
.lp-empty p{font-size:12px;color:var(--t3);line-height:1.5;}
.cr{display:flex;align-items:center;gap:10px;padding:9px 11px;cursor:pointer;transition:background .15s;position:relative;}
.cr:hover{background:var(--bg5);}
.cr.active{background:var(--accS);}
.cr.active::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:var(--acc2);border-radius:3px 0 0 3px;}
.cr-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;}
.cr-dot{position:absolute;bottom:1px;right:1px;width:8px;height:8px;border-radius:50%;background:var(--online);border:2px solid var(--bg3);}
.cr-info{flex:1;min-width:0;}
.cr-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cr-prev{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.cr-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.cr-time{font-size:10px;color:var(--t3);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;z-index:8;}
.topbar{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--bg3);border-bottom:1px solid rgba(124,58,237,.1);flex-shrink:0;}
.tb-logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:14px;background:linear-gradient(90deg,#a78bfa,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tb-sp{flex:1;}
.tb-user{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--t2);}
.tb-av-sm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
.tb-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);border:none;background:none;transition:all .18s;}
.tb-btn:hover{background:var(--accS);color:var(--acc2);}
.tb-btn svg{width:16px;height:16px;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* FEED */
#scFeed{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.stories-bar{display:flex;align-items:center;gap:11px;padding:12px 18px 10px;border-bottom:1px solid rgba(124,58,237,.07);overflow-x:auto;flex-shrink:0;}
.sto-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;}
.sto-ring{width:46px;height:46px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#7c3aed,#a78bfa,#6d28d9);transition:transform .2s;}
.sto-inner{width:100%;height:100%;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid var(--bg);}
.sto-name{font-size:10px;color:var(--t2);white-space:nowrap;max-width:48px;overflow:hidden;text-overflow:ellipsis;}
.composer{margin:11px 18px;background:var(--bg4);border:1px solid var(--accB);border-radius:var(--r);padding:12px;flex-shrink:0;}
.comp-top{display:flex;align-items:center;gap:10px;}
.comp-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.comp-ta{flex:1;background:var(--bg2);border:1px solid rgba(124,58,237,.18);border-radius:20px;padding:8px 13px;font-family:'Nunito',sans-serif;font-size:13px;color:var(--t1);outline:none;resize:none;min-height:37px;max-height:125px;line-height:1.5;}
.comp-photo-prev{display:none;margin-top:9px;position:relative;}
.comp-photo-prev img{width:100%;max-height:185px;object-fit:cover;border-radius:9px;border:1px solid var(--accB);}
.rm-photo{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:12px;}
.comp-bot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:9px;border-top:1px solid rgba(124,58,237,.08);}
.comp-tools{display:flex;gap:3px;}
.ct{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);border:none;background:none;}
.ct:hover{background:var(--accS);color:var(--acc2);}
.pub-btn{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;border:none;border-radius:17px;padding:7px 17px;font-weight:700;font-size:12.5px;cursor:pointer;}
.feed-posts{display:flex;flex-direction:column;}
.post{background:var(--bg4);border-bottom:1px solid rgba(124,58,237,.07);padding:13px 18px;animation:pIn .22s ease-out;}
.post-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.p-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
.p-name{font-weight:700;font-size:13px;}
.p-time{font-size:10.5px;color:var(--t3);}
.p-del{margin-left:auto;cursor:pointer;color:var(--t3);background:none;border:none;padding:4px;border-radius:6px;display:none;}
.p-del.mine{display:flex;}
.p-del:hover{background:rgba(248,113,113,.12);color:#f87171;}
.post-text{font-size:13.5px;line-height:1.65;margin-bottom:9px;white-space:pre-wrap;}
.post-img{width:100%;border-radius:9px;max-height:350px;object-fit:cover;margin-bottom:10px;}
.post-acts{display:flex;align-items:center;gap:14px;padding-top:8px;border-top:1px solid rgba(124,58,237,.07);}
.pa{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--t3);font-size:12.5px;font-weight:700;background:none;border:none;}
.pa.liked{color:#f472b6;}
.post-cmts{margin-top:8px;border-top:1px solid rgba(124,58,237,.07);padding-top:8px;display:none;flex-direction:column;gap:7px;}
.post-cmts.open{display:flex;}
.cmt-row{display:flex;gap:8px;align-items:flex-start;}
.cmt-av{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.cmt-bubble{flex:1;background:var(--bg2);border-radius:11px;padding:7px 11px;}
.cmt-author{font-size:11.5px;font-weight:700;}
.cmt-text{font-size:12.5px;color:var(--t2);}
.cmt-inp-row{display:flex;gap:7px;align-items:center;margin-top:3px;}
.cmt-inp{flex:1;background:var(--bg2);border:1px solid rgba(124,58,237,.18);border-radius:18px;padding:6px 12px;color:var(--t1);outline:none;}
.cmt-send{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#7c3aed);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;}

/* CHAT */
#scChat{display:none;flex:1;flex-direction:column;}
.chat-hdr{display:flex;align-items:center;gap:11px;padding:10px 15px;background:var(--bg3);border-bottom:1px solid rgba(124,58,237,.1);flex-shrink:0;}
.ch-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
.ch-name{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;}
.ch-status{font-size:11px;color:var(--online);}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:2px;}
.msg-row{display:flex;align-items:flex-end;gap:6px;max-width:72%;margin-bottom:4px;animation:mIn .2s;}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse;}
.msg-mini-av{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.bubble{padding:8px 12px;border-radius:15px;font-size:13px;line-height:1.5;}
.out .bubble{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;border-bottom-right-radius:4px;}
.in .bubble{background:var(--bg4);color:var(--t1);border-bottom-left-radius:4px;border:1px solid rgba(124,58,237,.12);}
.msg-meta{font-size:10px;margin-top:2px;opacity:.7;}
.chat-inp{padding:9px 13px;background:var(--bg3);border-top:1px solid rgba(124,58,237,.1);display:flex;gap:7px;flex-shrink:0;}
.cin-wrap{flex:1;background:var(--bg4);border:1px solid rgba(124,58,237,.2);border-radius:12px;padding:7px 12px;display:flex;}
.cin-ta{flex:1;background:none;border:none;outline:none;color:var(--t1);font-size:13px;resize:none;}
.send-btn{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6d28d9,#7c3aed);border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;}

/* RIGHT PANEL */
.rp{width:236px;background:var(--bg3);border-left:1px solid rgba(124,58,237,.1);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.rp-sec{padding:13px;border-bottom:1px solid rgba(124,58,237,.07);}
.rp-ttl{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--t3);margin-bottom:9px;}
.ou{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;}
.ou-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;}
.ou-dot{position:absolute;bottom:0;right:0;width:7px;height:7px;border-radius:50%;background:var(--online);border:2px solid var(--bg3);}
.ou-name{font-size:12.5px;font-weight:700;}
.stat-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;padding:9px 20px;border-radius:20px;font-size:12.5px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#photoInput{display:none;}
.av-a{background:linear-gradient(135deg,#4c1d95,#7c3aed);}
.av-b{background:linear-gradient(135deg,#312e81,#6366f1);}
.av-c{background:linear-gradient(135deg,#5b21b6,#8b5cf6);}
.av-d{background:linear-gradient(135deg,#701a75,#a21caf);}
.av-e{background:linear-gradient(135deg,#1e1b4b,#4338ca);}
.av-f{background:linear-gradient(135deg,#3b0764,#6d28d9);}
.av-g{background:linear-gradient(135deg,#134e4a,#0d9488);}
.av-h{background:linear-gradient(135deg,#7c2d12,#ea580c);}
</style>
</head>
<body>

<div id="authScreen"><div class="auth-card"><div class="auth-logo"><div class="auth-logo-icon">Zx</div><h1>ZaxodMessenger</h1><p>Облачный мессенджер без серверов</p></div>
<div class="auth-tabs"><div class="auth-tab active" onclick="setAuthTab('login')">Войти</div><div class="auth-tab" onclick="setAuthTab('reg')">Регистрация</div></div>
<div id="loginForm"><div class="auth-field"><label>ИМЯ</label><input type="text" id="loginName" placeholder="Ваш никнейм" autocomplete="off"></div>
<div class="auth-field"><label>ПАРОЛЬ</label><input type="password" id="loginPass" placeholder="••••••"></div>
<button class="auth-btn" onclick="doLogin()">Войти в Zaxod</button></div>
<div id="regForm" style="display:none;"><div class="auth-field"><label>НОВОЕ ИМЯ</label><input type="text" id="regName" placeholder="от 2 символов"></div>
<div class="auth-field"><label>ПАРОЛЬ</label><input type="password" id="regPass" placeholder="мин. 3 символа"></div>
<div class="av-picker-row" id="avPicker"><div class="av-pick av-a sel" onclick="pickAv(this,'🦊')">🦊</div><div class="av-pick av-b" onclick="pickAv(this,'🐺')">🐺</div><div class="av-pick av-c" onclick="pickAv(this,'🐉')">🐉</div><div class="av-pick av-d" onclick="pickAv(this,'🌙')">🌙</div><div class="av-pick av-e" onclick="pickAv(this,'⚡')">⚡</div><div class="av-pick av-f" onclick="pickAv(this,'🔮')">🔮</div></div>
<button class="auth-btn" onclick="doRegister()">Создать аккаунт</button></div>
<div class="auth-err" id="authErr"></div></div></div>

<div id="app" style="display:none;"><div class="sbi"><div class="sbi-logo">Zx</div>
<button class="nb active" id="nb-feed" onclick="switchScreen('feed')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
<button class="nb" id="nb-chat" onclick="switchScreen('chat')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
<div class="sp"></div><div class="me-av" id="meAv" onclick="doLogout()">😊</div></div>
<div class="lp"><div class="lp-head"><div class="lp-title" id="lpTitle">Новостная лента</div><div class="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="srchInp" placeholder="Поиск..." oninput="doSearch(this.value)"></div></div>
<div class="lp-tabs"><div class="lp-tab active" onclick="selTab(this,'all')">Все</div><div class="lp-tab" onclick="selTab(this,'online')">Онлайн</div></div>
<div class="lp-list" id="lpList"></div></div>
<div class="main"><div class="topbar"><div class="tb-logo">ZaxodMessenger</div><div class="tb-sp"></div><div class="tb-user"><span id="tbName">—</span><div class="tb-av-sm" id="tbAv">😊</div></div><button class="tb-btn" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button></div>
<div class="content"><div id="scFeed" style="flex:1;overflow-y:auto;"><div class="stories-bar" id="storiesBar"><div class="sto-item"><div class="sto-ring sto-add-ring"><div class="sto-inner">+</div></div><div class="sto-name">Моя история</div></div></div>
<div class="composer"><div class="comp-top"><div class="comp-av" id="compAv">😊</div><textarea class="comp-ta" id="postTA" rows="1" placeholder="Поделитесь новостью — все увидят!"></textarea></div>
<div id="photoPrev" class="comp-photo-prev"><img id="prevImg" src=""><div class="rm-photo" onclick="rmPhoto()">✕</div></div>
<div class="comp-bot"><div class="comp-tools"><button class="ct" onclick="document.getElementById('photoInput').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button></div><button class="pub-btn" id="pubBtn" onclick="publishPost()">Опубликовать</button></div></div>
<input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">
<div class="feed-posts" id="feedPosts"></div></div>
<div id="scChat" style="display:none;"><div class="chat-hdr" id="chatHdr" style="display:none;"><div class="ch-av" id="chHdrAv">😊</div><div><div class="ch-name" id="chHdrName">—</div><div class="ch-status">онлайн</div></div><div class="ch-sp"></div></div>
<div class="chat-msgs" id="chatMsgs"><div class="chat-empty-st" id="chatEmpSt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" width="46" height="46"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><h3>Выберите собеседника</h3></div></div>
<div class="chat-inp" id="chatInp" style="display:none;"><div class="cin-wrap"><textarea class="cin-ta" id="chatTA" rows="1" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea></div><button class="send-btn" onclick="sendMsg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div></div></div></div>
<div class="rp"><div class="rp-sec"><div class="rp-ttl">Онлайн сейчас</div><div id="onlineList"></div></div><div class="rp-sec"><div class="rp-ttl">Статистика</div><div class="stat-row"><span>Постов</span><span id="stP">0</span></div><div class="stat-row"><span>Лайков</span><span id="stL">0</span></div></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
// ⚡️ API KEY (вставлен)
const API_KEY = "zEYADg.0UQkWg:zZk7jhvjFAzqdHbKS42nn8RgOTx9LTGDxRzP4HFz1Qw";
const DB_URL = "https://api.jsonbin.io/v3/b";
const BIN_ID = "67f3d9228561e97a50f2fbcb"; // статичный бин для всех данных

let ME = null, curScreen = 'feed', curChat = null, pollInterval = null, srchQ = '', lpTab = 'all';
let pendingPhoto = null;
const AVATARS = ['av-a','av-b','av-c','av-d','av-e','av-f','av-g','av-h'];
function getAvatarClass(name) { let h = 0; for(let c of name) h = (h*31 + c.charCodeAt(0)) & 0xfffff; return AVATARS[h % AVATARS.length]; }
function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ago(ts) { let d = Math.floor((Date.now()-ts)/1000); if(d<60) return 'только что'; if(d<3600) return Math.floor(d/60)+'м'; if(d<86400) return Math.floor(d/3600)+'ч'; return Math.floor(d/86400)+'д'; }
function fmt(ts) { let d = new Date(ts); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function showToast(msg) { let t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }

// === API облачного хранилища ===
async function loadCloudData() {
  try {
    let resp = await fetch(`${DB_URL}/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
    let data = await resp.json();
    return data.record || { users: [], posts: [], chats: {}, online: {} };
  } catch(e) { console.warn(e); return { users: [], posts: [], chats: {}, online: {} }; }
}
async function saveCloudData(data) {
  try {
    await fetch(`${DB_URL}/${BIN_ID}`, { method: 'PUT', headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY }, body: JSON.stringify(data) });
  } catch(e) { console.warn(e); }
}
async function syncNow() {
  if(!ME) return;
  let cloud = await loadCloudData();
  // обновляем online статус
  cloud.online[ME.name] = { name: ME.name, emoji: ME.emoji, ts: Date.now() };
  await saveCloudData(cloud);
}
async function getFullState() { return await loadCloudData(); }
async function commitState(state) { await saveCloudData(state); }

// === АВТОРИЗАЦИЯ ===
let authTab = 'login', selectedEmoji = '🦊';
function setAuthTab(t) { authTab = t; document.querySelectorAll('.auth-tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='reg'))); document.getElementById('loginForm').style.display=t==='login'?'':'none'; document.getElementById('regForm').style.display=t==='reg'?'':'none'; document.getElementById('authErr').textContent=''; }
function pickAv(el, em) { document.querySelectorAll('.av-pick').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); selectedEmoji = em; }
async function doRegister() {
  let name = document.getElementById('regName').value.trim();
  let pass = document.getElementById('regPass').value;
  if(name.length<2) return setErr('Имя минимум 2 символа');
  if(pass.length<3) return setErr('Пароль минимум 3 символа');
  let state = await getFullState();
  if(state.users.find(u=>u.name===name)) return setErr('Имя уже занято');
  let newUser = { name, pass, emoji: selectedEmoji, avClass: getAvatarClass(name), reg: Date.now() };
  state.users.push(newUser);
  await commitState(state);
  localStorage.setItem('zaxodUser', JSON.stringify({ name, emoji: selectedEmoji }));
  ME = newUser; launchApp();
}
async function doLogin() {
  let name = document.getElementById('loginName').value.trim();
  let pass = document.getElementById('loginPass').value;
  let state = await getFullState();
  let user = state.users.find(u=>u.name===name);
  if(!user) return setErr('Пользователь не найден');
  if(user.pass !== pass) return setErr('Неверный пароль');
  localStorage.setItem('zaxodUser', JSON.stringify({ name: user.name, emoji: user.emoji }));
  ME = user; launchApp();
}
function setErr(m) { document.getElementById('authErr').textContent = m; }
async function doLogout() {
  if(ME) {
    let state = await getFullState();
    delete state.online[ME.name];
    await commitState(state);
  }
  localStorage.removeItem('zaxodUser'); ME = null; clearInterval(pollInterval);
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}
async function tryAutoLogin() {
  let saved = localStorage.getItem('zaxodUser');
  if(!saved) return false;
  let { name } = JSON.parse(saved);
  let state = await getFullState();
  let user = state.users.find(u=>u.name===name);
  if(user) { ME = user; return true; }
  return false;
}

// === ГЛАВНЫЙ ЗАПУСК ===
async function launchApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('tbName').textContent = ME.name;
  document.getElementById('tbAv').textContent = ME.emoji || '😊';
  document.getElementById('meAv').textContent = ME.emoji || '😊';
  document.getElementById('compAv').textContent = ME.emoji || '😊';
  await syncNow();
  await loadFeed(); await renderOnlineList(); await renderLpList(); updateStats();
  if(pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    if(ME) await syncNow();
    await renderOnlineList();
    if(curScreen === 'feed') await loadFeed();
    if(curScreen === 'chat' && curChat) await loadMessages(curChat);
    renderLpList();
  }, 3500);
}
function switchScreen(s) { curScreen = s; document.getElementById('scFeed').style.display = s==='feed'?'flex':'none'; document.getElementById('scChat').style.display = s==='chat'?'flex':'none'; document.getElementById('nb-feed').classList.toggle('active',s==='feed'); document.getElementById('nb-chat').classList.toggle('active',s==='chat'); document.getElementById('lpTitle').textContent = s==='feed'?'Новостная лента':'Сообщения'; if(s==='feed') loadFeed(); renderLpList(); }
function selTab(el,t) { document.querySelectorAll('.lp-tab').forEach(x=>x.classList.remove('active')); el.classList.add('active'); lpTab = t; renderLpList(); }
function doSearch(q) { srchQ = q.toLowerCase(); renderLpList(); }

// === ОНЛАЙН ===
async function renderOnlineList() {
  let state = await getFullState();
  let now = Date.now();
  let onlineUsers = Object.values(state.online).filter(o => o.name !== ME.name && (now - o.ts) < 12000);
  let html = onlineUsers.length ? onlineUsers.map(u => `<div class="ou" onclick="openChat('${esc(u.name)}','${u.emoji||'😊'}')"><div class="ou-av ${getAvatarClass(u.name)}">${u.emoji||'😊'}<div class="ou-dot"></div></div><div><div class="ou-name">${esc(u.name)}</div><div class="ou-sub">онлайн</div></div></div>`).join('') : '<div style="font-size:12px;color:var(--t3);">Никого нет :(</div>';
  document.getElementById('onlineList').innerHTML = html;
}

// === ЛЕВАЯ ПАНЕЛЬ ===
async function renderLpList() {
  let state = await getFullState();
  if(curScreen === 'feed') {
    let authors = new Map();
    for(let p of state.posts) { if(!authors.has(p.author)) authors.set(p.author, { emoji: p.emoji, lastPost: p.ts }); else { let ex = authors.get(p.author); if(p.ts > ex.lastPost) ex.lastPost = p.ts; } }
    let arr = Array.from(authors.entries()).map(([name,val])=>({name, emoji:val.emoji, ts:val.lastPost})).sort((a,b)=>b.ts - a.ts);
    if(srchQ) arr = arr.filter(a=>a.name.toLowerCase().includes(srchQ));
    document.getElementById('lpList').innerHTML = arr.length ? arr.map(u=>`<div class="cr" onclick="openChat('${esc(u.name)}','${u.emoji}')"><div class="cr-av ${getAvatarClass(u.name)}">${u.emoji}</div><div class="cr-info"><div class="cr-name">${esc(u.name)}</div><div class="cr-prev">активен</div></div></div>`).join('') : `<div class="lp-empty"><p>Постов пока нет</p></div>`;
  } else {
    let users = state.users.filter(u => u.name !== ME.name);
    if(lpTab === 'online') { let now=Date.now(); let onlineSet = new Set(Object.entries(state.online).filter(([k,v])=>(now-v.ts)<12000).map(([k])=>k)); users = users.filter(u=>onlineSet.has(u.name)); }
    if(srchQ) users = users.filter(u=>u.name.toLowerCase().includes(srchQ));
    document.getElementById('lpList').innerHTML = users.length ? users.map(u=>`<div class="cr ${curChat===u.name?'active':''}" onclick="openChat('${esc(u.name)}','${u.emoji||'😊'}')"><div class="cr-av ${getAvatarClass(u.name)}">${u.emoji||'😊'}</div><div class="cr-info"><div class="cr-name">${esc(u.name)}</div><div class="cr-prev">напишите сообщение</div></div></div>`).join('') : `<div class="lp-empty"><p>Нет пользователей</p></div>`;
  }
}

// === ЛЕНТА ===
async function loadFeed() {
  let state = await getFullState();
  let posts = [...state.posts].sort((a,b)=>b.ts - a.ts);
  if(!posts.length) { document.getElementById('feedPosts').innerHTML = `<div class="no-posts"><h3>Лента пуста</h3><p>Опубликуйте первый пост!</p></div>`; return; }
  document.getElementById('feedPosts').innerHTML = posts.map(p => buildPostHtml(p, ME.name)).join('');
}
function buildPostHtml(p, myName) {
  let mine = p.author === myName;
  let liked = p.likes && p.likes.includes(myName);
  let likesCount = p.likes?.length || 0;
  let commentsHtml = (p.comments || []).map(c => `<div class="cmt-row"><div class="cmt-av ${getAvatarClass(c.author)}">${c.emoji||'😊'}</div><div class="cmt-bubble"><div class="cmt-author">${esc(c.author)}</div><div class="cmt-text">${esc(c.text)}</div></div></div>`).join('');
  return `<div class="post" id="post${p.id}"><div class="post-hdr"><div class="p-av ${getAvatarClass(p.author)}">${p.emoji||'😊'}</div><div><div class="p-name">${esc(p.author)}</div><div class="p-time">${ago(p.ts)}</div></div>${mine?`<button class="p-del mine" onclick="deletePost(${p.id})">🗑️</button>`:''}</div>${p.text?`<div class="post-text">${esc(p.text)}</div>`:''}${p.photo?`<img class="post-img" src="${p.photo}" alt="">`:''}<div class="post-acts"><button class="pa ${liked?'liked':''}" onclick="toggleLike(${p.id})">❤️ ${likesCount}</button><button class="pa" onclick="toggleComments(${p.id})">💬 ${p.comments?.length||0}</button><button class="pa" onclick="openChat('${esc(p.author)}','${p.emoji||'😊'}')">✉️</button></div><div class="post-cmts" id="cmts${p.id}">${commentsHtml}<div class="cmt-inp-row"><div class="cmt-av ${getAvatarClass(myName)}">${ME.emoji}</div><input class="cmt-inp" id="cmtInp${p.id}" placeholder="Комментарий..."><button class="cmt-send" onclick="addComment(${p.id})">➤</button></div></div></div>`;
}
async function toggleLike(postId) {
  let state = await getFullState();
  let post = state.posts.find(p=>p.id===postId);
  if(!post) return;
  if(!post.likes) post.likes=[];
  let idx = post.likes.indexOf(ME.name);
  if(idx>=0) post.likes.splice(idx,1); else post.likes.push(ME.name);
  await commitState(state);
  await loadFeed(); updateStats();
}
async function addComment(postId) {
  let inp = document.getElementById(`cmtInp${postId}`);
  let txt = inp.value.trim(); if(!txt) return;
  let state = await getFullState();
  let post = state.posts.find(p=>p.id===postId);
  if(!post) return;
  if(!post.comments) post.comments=[];
  post.comments.push({ author: ME.name, emoji: ME.emoji, text: txt, ts: Date.now() });
  await commitState(state);
  inp.value = '';
  await loadFeed();
  document.getElementById(`cmts${postId}`)?.classList.add('open');
}
async function deletePost(id) {
  let state = await getFullState();
  state.posts = state.posts.filter(p=>p.id!==id);
  await commitState(state);
  await loadFeed(); await renderLpList(); updateStats(); showToast('Пост удалён');
}
function toggleComments(id) { let el = document.getElementById(`cmts${id}`); if(el) el.classList.toggle('open'); }
async function publishPost() {
  let text = document.getElementById('postTA').value.trim();
  if(!text && !pendingPhoto) return;
  let state = await getFullState();
  let newPost = { id: Date.now(), author: ME.name, emoji: ME.emoji, text: text, photo: pendingPhoto, ts: Date.now(), likes: [], comments: [] };
  state.posts.push(newPost);
  await commitState(state);
  document.getElementById('postTA').value = ''; rmPhoto();
  await loadFeed(); await renderLpList(); updateStats(); showToast('Пост опубликован!');
}
function handlePhoto(e) { let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=ev=>{ pendingPhoto=ev.target.result; document.getElementById('prevImg').src=pendingPhoto; document.getElementById('photoPrev').style.display='block'; }; r.readAsDataURL(f); e.target.value=''; }
function rmPhoto() { pendingPhoto=null; document.getElementById('photoPrev').style.display='none'; document.getElementById('prevImg').src=''; }

// === ЧАТ ===
async function openChat(name, emoji) {
  curChat = name;
  if(curScreen !== 'chat') switchScreen('chat');
  document.getElementById('chatEmpSt').style.display = 'none';
  document.getElementById('chatHdr').style.display = 'flex';
  document.getElementById('chatInp').style.display = 'flex';
  document.getElementById('chHdrAv').textContent = emoji || '😊';
  document.getElementById('chHdrName').textContent = name;
  await loadMessages(name);
  renderLpList();
}
async function loadMessages(otherUser) {
  let state = await getFullState();
  let key = [ME.name, otherUser].sort().join('|');
  let messages = state.chats[key] || [];
  let container = document.getElementById('chatMsgs');
  if(!messages.length) { container.innerHTML = `<div class="chat-empty-st"><h3>Напишите первое сообщение ✨</h3></div>`; return; }
  container.innerHTML = messages.map(m => {
    let out = m.from === ME.name;
    return `<div style="display:flex;justify-content:${out?'flex-end':'flex-start'};"><div class="msg-row ${out?'out':'in'}">${!out?`<div class="msg-mini-av ${getAvatarClass(m.from)}">${m.emoji||'😊'}</div>`:''}<div class="msg-grp"><div class="bubble">${esc(m.text)}</div><div class="msg-meta">${fmt(m.ts)}</div></div>${out?`<div class="msg-mini-av ${getAvatarClass(m.from)}">${m.emoji||'😊'}</div>`:''}</div></div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}
async function sendMsg() {
  let ta = document.getElementById('chatTA');
  let txt = ta.value.trim(); if(!txt || !curChat) return;
  let state = await getFullState();
  let key = [ME.name, curChat].sort().join('|');
  if(!state.chats[key]) state.chats[key] = [];
  state.chats[key].push({ from: ME.name, emoji: ME.emoji, text: txt, ts: Date.now() });
  if(state.chats[key].length > 300) state.chats[key] = state.chats[key].slice(-300);
  await commitState(state);
  ta.value = ''; ta.style.height = 'auto';
  await loadMessages(curChat);
}
async function updateStats() {
  let state = await getFullState();
  let myPosts = state.posts.filter(p=>p.author===ME.name);
  let likes = myPosts.reduce((acc,p)=>acc + (p.likes?.length||0),0);
  document.getElementById('stP').textContent = myPosts.length;
  document.getElementById('stL').textContent = likes;
}

// === СТАРТ ===
window.onload = async () => { if(await tryAutoLogin()) await launchApp(); };
window.addEventListener('beforeunload', async() => { if(ME) { let s=await getFullState(); delete s.online[ME.name]; await commitState(s); } });
</script>
</body>
</html>
